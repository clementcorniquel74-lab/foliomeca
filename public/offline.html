<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FolioMeca — Hors ligne</title>
    <style>
      body { margin:0; height:100vh; display:flex; align-items:center; justify-content:center; background:#0B0F14; color:#E7ECF1; font-family: Inter, system-ui, sans-serif; text-align:center; padding:24px; }
      .card { max-width: 380px; }
      .dot { width:72px; height:72px; border-radius:50%; margin:0 auto 16px; overflow:hidden; box-shadow: 0 0 24px -6px rgba(255,106,26,0.45); }
      .dot img { width:100%; height:100%; object-fit:cover; }
      h1 { font-size:20px; margin:0 0 8px; }
      p { color:#94A3B5; font-size:14px; line-height:1.5; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="dot"><img src="/logo.png" alt="FolioMeca" /></div>
      <h1>Pas de connexion</h1>
      <p>FolioMeca fonctionne en mode limité hors-ligne. Les données déjà consultées restent disponibles. Reconnectez-vous pour synchroniser votre garage.</p>
    </div>
  </body>
</html>
